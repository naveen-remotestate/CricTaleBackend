version: "3.6"

services:
  db:

    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: naveen
      POSTGRES_PASSWORD: naveen
      POSTGRES_DB: crictail-db
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
     DB_HOST: db
     DB_PORT: 5432
     DB_USER: naveen
     DB_PASSWORD: naveen
     DB_NAME: crictail-db
     SSL_MODE: disable
    depends_on:
      - db


volumes:
  pgdata: